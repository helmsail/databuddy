# DataBuddy 单机编排:一台机器 = MySQL(系统库)+ 应用(图/四子域/会话域/沙箱调度)
# —— 挂载口径:数据根落宿主(本机=.env 指定 → 项目 data/,已 gitignore),沙箱可用
#
# 使用:
#   docker compose up -d --build             # 起 MySQL + 应用
#   docker compose --profile sandbox build   # 用到 Python 执行前先构建沙箱镜像(运行期 --pull=never)
#   docker compose down                      # 停删(库随容器消失;data/ 留在宿主,不提交)
#
# —— 变量唯一来源:.env(已 gitignore) ——
#   APP_PORT / MYSQL_PORT / MYSQL_ROOT_PASSWORD / DATABUDDY_DATA_ROOT / PIP_INDEX / APT_MIRROR
#   compose 侧一律 ${VAR:?} 引用:不留任何默认值,缺失或为空直接报错点名。
# —— 数据根目录(DooD 关键:宿主路径与容器路径必须是"同一个字符串")——
#   沙箱容器由应用经挂载的 docker.sock 调【宿主 daemon】创建(docker-out-of-docker),
#   -v 源路径按 daemon 视角解析;应用与沙箱要看到同一份文件,只能让两边路径字符串一致。
#   Docker Desktop(本机):/run/desktop/mnt/host/d/databuddy/data(即项目 data/,探针实测通过)
#   Linux 单机:           /srv/databuddy/data
name: databuddy

services:

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      # 密码值在 .env(开发口径 root/root,与 application.yml 一致);正式环境务必改
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      MYSQL_DATABASE: databuddy            # 系统库;表结构由应用启动时 sql.init 幂等创建
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # 本机已有 MySQL 占用 3306 时:MYSQL_PORT=3307(宿主机应用的连接串同步改)
      - "${MYSQL_PORT:?}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    build: .
    image: databuddy:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${APP_PORT:?}:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/databuddy?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      # 数据根 → 文档存储与沙箱工作目录(宿主/容器必须同字符串,见文件头)
      DATABUDDY_STORAGE_LOCALROOTPATH: ${DATABUDDY_DATA_ROOT:?}/files
      DATABUDDY_PYTHON_WORKROOT: ${DATABUDDY_DATA_ROOT:?}/sandbox
      TZ: Asia/Shanghai
    volumes:
      # 沙箱:应用内 docker CLI 经此 socket 调宿主 daemon(工作目录权限由应用侧处理,见 Sandbox.create)
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATABUDDY_DATA_ROOT:?}:${DATABUDDY_DATA_ROOT:?}
    # @PreDestroy 销毁空闲沙箱容器可能超过默认 10s;超时被强杀也无碍(启动时有人兜底清理)
    stop_grace_period: 30s

  # 只为构建沙箱镜像而存在的服务(不常驻;仅 --profile sandbox 时调度)
  sandbox-image:
    image: databuddy-python:3.12
    profiles: ["sandbox"]
    build:
      context: docker/python
      args:
        PIP_INDEX: ${PIP_INDEX:?}
        APT_MIRROR: ${APT_MIRROR:?}
    command: ["true"]
