# DataBuddy 前端:静态页 + 反代同源访问 API(容器网络内后端为 app:8080)
# 上游用变量 + Docker 内置 DNS(127.0.0.11)运行期解析:app 容器重建换 IP 后无需重启本容器
server {
    listen 80;
    server_name _;
    charset utf-8;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # API 反代 → 应用容器(同源,无 CORS;SSE 必须关缓冲)
    location ~ ^/(agent|session|graph|aimodel|bizdatabase|prompt|actuator)(/|$) {
        set $backend app:8080;
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri /index.html;
    }
}
