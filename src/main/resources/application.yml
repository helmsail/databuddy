spring:
  application:
    name: databuddy
  config:
    # 变量唯一来源:项目根 .env(已 gitignore;本机直跑与 compose 共用同一份);文件不存在(如容器内)则跳过,改由环境变量注入
    import: optional:file:./.env[.properties]
  reactor:
    context-propagation: auto # Reactor 上下文自动传播:图上节点(@Observed)的 span 才能挂到 HTTP 请求的 trace 上
  datasource: # 系统库(应用自有:提示词、图检查点等元数据;被分析的业务库走 bizdatabase 包,jdbc 引擎内嵌于此)
    url: jdbc:mysql://localhost:3306/databuddy?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${DATABUDDY_DB_PASSWORD} # 机密:无默认值,来自 .env / 容器环境变量(compose 用 SPRING_DATASOURCE_PASSWORD 覆盖);缺失即启动失败
  sql:
    init: # 启动执行系统库初始化脚本(幂等:IF NOT EXISTS)
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/schema.sql
  ai:
    mcp:
      server: # MCP 入口(同进程同端口自动暴露 /mcp;工具见 mcp 包)
        name: databuddy
        version: 1.0.0
        protocol: STREAMABLE # MCP 传输:Streamable HTTP(2026 规范;给旧版 SSE 客户端用可改 SSE)

mybatis: # 系统库 Mapper 的映射依赖:列名下划线 → 实体属性驼峰(MyBatis 核心默认关闭,显式打开)
  configuration:
    map-underscore-to-camel-case: true

databuddy:
  storage:
    local-root-path: ./data/files
  graph:
    plan-review-timeout: 24h # 人工确认闸的挂起等待窗口(超时作废检查点)
    plan-review-sweep: 10m # 挂起超时清扫周期(定时扫描)
  python:
    image: databuddy-python:3.12 # 沙箱镜像,先构建 docker/python/Dockerfile
    min-idle: 1 # 常驻容器数(启动后异步预热)
    max-total: 3 # 容器总数上限
    idle-ttl: 10m # 空闲收缩:超过该时长且多余常驻的容器销毁
    borrow-timeout: 30s # 借容器等待上限,超时视为容量耗尽
    exec-timeout: 60s # 单次执行超时,超时容器直接销毁
    work-root: ./data/sandbox # 工作目录根(宿主侧,挂载进容器 /work)
  crypto:
    # 敏感字段落库加密密钥(AES-256-GCM,Base64 32 字节):机密项,无默认值,来自 .env / 容器环境变量;缺失即启动失败
    # 正式环境务必更换;换钥后旧的业务库配置密文解不开,需重新保存一遍业务库配置(重加密);生成:AesUtil.generateKey()
    aes-key: ${DATABUDDY_AES_KEY}

management:
  tracing:
    sampling:
      probability: 1.0 # 本地全采样(Boot 默认 0.1,调试期会随机丢)
  endpoints:
    web:
      exposure:
        include: health,metrics
  # —— 接入 Langfuse 时,取消下面注释即可 ——
  # otlp:
  #   tracing:
  #     endpoint: http://localhost:3000/api/public/otel/v1/traces
  #     headers:
  #       Authorization: "Basic <base64(publicKey:secretKey)>"

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
