spring:
  application:
    name: databuddy
  reactor:
    context-propagation: auto # Reactor 上下文自动传播:图上节点(@Observed)的 span 才能挂到 HTTP 请求的 trace 上
  datasource: # 系统库(应用自有:提示词、图检查点等元数据;被分析的业务库走 databuddy jdbc 包)
    url: jdbc:mysql://localhost:3306/databuddy?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
  sql:
    init: # 启动执行系统库初始化脚本(幂等:IF NOT EXISTS)
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/schema.sql

mybatis: # 系统库 Mapper 的映射依赖:列名下划线 → 实体属性驼峰(MyBatis 核心默认关闭,显式打开)
  configuration:
    map-underscore-to-camel-case: true

databuddy:
  storage:
    local-root-path: ./data/files
  python:
    image: databuddy-python:3.12 # 沙箱镜像,先构建 docker/python/Dockerfile
    min-idle: 1 # 常驻容器数(启动后异步预热)
    max-total: 3 # 容器总数上限
    idle-ttl: 10m # 空闲收缩:超过该时长且多余常驻的容器销毁
    borrow-timeout: 30s # 借容器等待上限,超时视为容量耗尽
    exec-timeout: 60s # 单次执行超时,超时容器直接销毁
    work-root: ./data/sandbox # 工作目录根(宿主侧,挂载进容器 /work)
  crypto:
    aes-key: "SSM6kT5gJH87byj4EGBZ5cm9yKkLbVvSy946Y5oKKdI=" # 敏感字段落库加密(AES-256-GCM,Base64 32 字节);生成:AesUtil.generateKey()

management:
  tracing:
    sampling:
      probability: 1.0 # 本地全采样(Boot 默认 0.1,调试期会随机丢)
  endpoints:
    web:
      exposure:
        include: health,metrics
  # —— 接入 Langfuse 时,取消下面注释即可 ——
  # otlp:
  #   tracing:
  #     endpoint: http://localhost:3000/api/public/otel/v1/traces
  #     headers:
  #       Authorization: "Basic <base64(publicKey:secretKey)>"

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
